[package]
name = "monad-evm2-fixtures"
description = "Monad blockchain fixture replay and execution parity checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
monad-evm2.workspace = true
evm2.workspace = true
alloy-consensus = { workspace = true, default-features = true, features = ["k256", "secp256k1"] }
alloy-primitives = { workspace = true, default-features = true, features = ["serde"] }
alloy-rlp.workspace = true
alloy-trie.workspace = true
clap.workspace = true
eyre.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
walkdir.workspace = true

# compare-monad-revm
monad-revm = { workspace = true, optional = true, features = ["std", "c-kzg", "secp256k1", "portable", "blst", "memory_limit"] }
revm = { workspace = true, optional = true, features = ["std"] }

[dev-dependencies]
alloy-eips.workspace = true
tempfile.workspace = true

[features]
compare-monad-revm = ["dep:monad-revm", "dep:revm"]

[lints]
workspace = true
