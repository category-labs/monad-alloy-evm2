[package]
name = "monad-evm2js"
description = "JavaScript-accessible Monad execution, state and inspection on evm2"
version = "0.1.0-preview.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
monad-evm2 = { path = "../monad-evm2", default-features = false }
evm2.workspace = true
alloy-consensus.workspace = true
alloy-eips = { version = "2.5", default-features = false, features = ["k256"] }
alloy-primitives.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.128"

[features]
# Optional compatibility oracle; never enabled when building the browser package.
compare-monad-revmjs-main = ["dep:monad-revmjs-reference"]

[dependencies.monad-revmjs-reference]
package = "monad-revmjs"
git = "https://github.com/category-labs/monad-revm"
rev = "6403f504c2bdab6875bd9cb34ad2d7aebb618309"
optional = true

[lints]
workspace = true
