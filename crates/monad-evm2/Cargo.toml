[package]
name = "monad-evm2"
description = "Monad execution on evm2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["monad", "evm", "evm2", "ethereum"]
categories = ["cryptography::cryptocurrencies"]
publish.workspace = true

[dependencies]
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
evm2.workspace = true
evm2-macros.workspace = true

# serde
serde = { workspace = true, optional = true }

# compare-monad-revm
monad-revm = { workspace = true, optional = true, features = ["std", "memory_limit"] }
revm = { workspace = true, optional = true, features = ["std"] }

[dev-dependencies]
alloy-eips.workspace = true
serde_json.workspace = true

[features]
default = ["std", "c-kzg", "secp256k1", "portable", "blst"]
std = ["evm2/std", "serde?/std"]
serde = ["dep:serde"]
c-kzg = ["evm2/c-kzg"]
secp256k1 = ["evm2/secp256k1"]
portable = ["evm2/portable"]
blst = ["evm2/blst"]
# Compatibility with callers that previously enabled memory limits explicitly.
memory_limit = []
# Optional reference engine for differential tests.
compare-monad-revm = ["dep:monad-revm", "dep:revm"]

[lints]
workspace = true
