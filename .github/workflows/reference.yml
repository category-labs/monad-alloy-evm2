name: Reference comparisons

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  reference:
    name: Compare with monad-revm 0.8.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPEC_REVISION: 12e2c05bcfa6daeef9c0f4c54c5c7a13fde39e89
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned execution fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: category-labs/monad-execution-specs
          ref: ${{ env.SPEC_REVISION }}
          path: .fixture-spec
          sparse-checkout: test/execution/fixtures/blockchain_tests
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Lint all features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test with reference comparisons
        run: cargo test --locked --workspace --all-features
      - name: Check documentation with all features
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build comparison runner
        run: cargo build --locked -p monad-evm2-fixtures --features compare-monad-revm
      - name: Replay corpus and check exact reference outcomes
        run: >-
          python3 .github/scripts/fixture_ci.py
          --runner target/debug/monad-evm2-fixtures
          --fixtures .fixture-spec/test/execution/fixtures/blockchain_tests
          --report fixture-results/reference.json
          --compare-monad-revm
      - name: Upload raw fixture and parity report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monad-reference-${{ env.SPEC_REVISION }}
          path: fixture-results/reference.json
          if-no-files-found: warn
