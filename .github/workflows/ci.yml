name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test, and document
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test default features
        run: cargo test --locked
      - name: Test all features
        run: cargo test --locked --all-features
      - name: Check documentation
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  no-std:
    name: Build without the standard library
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: thumbv7em-none-eabi
      - name: Check no_std
        run: cargo check --locked --lib --no-default-features --target thumbv7em-none-eabi
      - name: Check no_std with serialization
        run: cargo check --locked --lib --no-default-features --features serde --target thumbv7em-none-eabi
