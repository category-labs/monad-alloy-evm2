name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test, and document
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test default features
        run: cargo test --locked -p monad-evm2
      - name: Test all features
        run: cargo test --locked -p monad-evm2 --all-features
      - name: Test without default features
        run: cargo test --locked -p monad-evm2 --no-default-features --features std,serde
      - name: Check documentation
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  fixtures:
    name: Replay Monad fixtures and check parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPEC_REVISION: 12e2c05bcfa6daeef9c0f4c54c5c7a13fde39e89
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned execution fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: category-labs/monad-execution-specs
          ref: ${{ env.SPEC_REVISION }}
          path: .fixture-spec
          sparse-checkout: test/execution/fixtures/blockchain_tests
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Test fixture runner and acceptance policy
        run: |
          cargo test --locked -p monad-evm2-fixtures
          cargo test --locked -p monad-evm2-fixtures --features compare-monad-revm
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build fixture runner
        run: cargo build --locked -p monad-evm2-fixtures --features compare-monad-revm
      - name: Replay corpus and check exact outcomes
        run: >-
          python3 .github/scripts/fixture_ci.py
          --runner target/debug/monad-evm2-fixtures
          --fixtures .fixture-spec/test/execution/fixtures/blockchain_tests
          --report fixture-results/report.json
          --compare-monad-revm
      - name: Upload raw fixture and parity report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monad-fixtures-${{ env.SPEC_REVISION }}
          path: fixture-results/report.json
          if-no-files-found: warn

  no-std:
    name: Build without the standard library
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: thumbv7em-none-eabi
      - name: Check no_std
        run: cargo check --locked -p monad-evm2 --lib --no-default-features --target thumbv7em-none-eabi
      - name: Check no_std with serialization
        run: cargo check --locked -p monad-evm2 --lib --no-default-features --features serde --target thumbv7em-none-eabi

  package:
    name: Check runtime package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Check packaged license
        run: |
          cmp LICENSE crates/monad-evm2/LICENSE
          cargo package --locked -p monad-evm2 --list > "${RUNNER_TEMP}/package-files.txt"
          grep -Fx LICENSE "${RUNNER_TEMP}/package-files.txt"
      - name: Check publication policy
        id: policy
        run: |
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          if ! jq -e '.packages[] | select(.name == "monad-evm2-fixtures") | .publish == []' <<< "${metadata}" > /dev/null; then
            echo "::error::The fixture runner must remain unpublished"
            exit 1
          fi
          enabled="$(jq -r '.packages[] | select(.name == "monad-evm2") | .publish != []' <<< "${metadata}")"
          echo "enabled=${enabled}" >> "${GITHUB_OUTPUT}"
      - name: Publish dry run
        if: steps.policy.outputs.enabled == 'true'
        run: cargo publish --locked -p monad-evm2 --registry crates-io --dry-run
