name: Publish Crate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Release checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish monad-evm2
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
      - name: Verify release tag and publication policy
        run: |
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          crate_version="$(jq -er '.packages[] | select(.name == "monad-evm2") | .version' <<< "${metadata}")"
          if [[ "${GITHUB_REF_NAME}" != "v${crate_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match monad-evm2 ${crate_version}"
            exit 1
          fi
          if ! jq -e '.packages[] | select(.name == "monad-evm2") | .publish != []' <<< "${metadata}" > /dev/null; then
            echo "::error::monad-evm2 publishing is disabled in Cargo.toml"
            exit 1
          fi
      - name: Publish dry run
        run: cargo publish --locked -p monad-evm2 --registry crates-io --dry-run
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        run: cargo publish --locked -p monad-evm2 --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
