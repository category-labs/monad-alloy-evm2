[workspace]
members = ["crates/monad-evm2", "crates/monad-fixtures"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Haythem Sellami - Category Labs <hsellami@category.xyz>"]
license = "MIT"
repository = "https://github.com/category-labs/monad-alloy-evm2"
publish = false

[workspace.dependencies]
monad-evm2 = { path = "crates/monad-evm2", version = "0.1.0" }
alloy-consensus = { version = "2.5", default-features = false }
alloy-eips = "2.5"
alloy-primitives = { version = "1.7", default-features = false, features = ["map"] }
alloy-rlp = "0.3"
alloy-sol-types = { version = "1.7", default-features = false }
alloy-trie = { version = "0.9", features = ["ethereum"] }
evm2 = { git = "https://github.com/alloy-rs/evm2", rev = "66687c18b34d3bdbb899f5eb7605070615c03475", default-features = false }
evm2-macros = { git = "https://github.com/alloy-rs/evm2", rev = "66687c18b34d3bdbb899f5eb7605070615c03475" }
monad-revm = { version = "=0.8.0", default-features = false }
revm = { version = "43.0.0", default-features = false }
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
tempfile = "3"
walkdir = "2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
redundant_clone = "warn"
