[workspace]
members = ["crates/monad-evm2", "crates/monad-fixtures", "crates/monad-evm2js"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Haythem Sellami - Category Labs <hsellami@category.xyz>"]
license = "MIT"
repository = "https://github.com/category-labs/monad-alloy-evm2"
publish = false

[workspace.dependencies]
monad-evm2 = { path = "crates/monad-evm2", version = "0.1.0" }
alloy-consensus = { version = "2.5", default-features = false }
alloy-eips = "2.5"
alloy-primitives = { version = "1.7", default-features = false, features = ["map"] }
alloy-rlp = "0.3"
alloy-sol-types = { version = "1.7", default-features = false }
alloy-trie = { version = "0.9", features = ["ethereum"] }
evm2 = { git = "https://github.com/alloy-rs/evm2", rev = "e25a95fb27de49d06ae9a23c4c9ee578a81504fc", default-features = false }
evm2-macros = { git = "https://github.com/alloy-rs/evm2", rev = "e25a95fb27de49d06ae9a23c4c9ee578a81504fc" }
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
tempfile = "3"
walkdir = "2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
redundant_clone = "warn"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
